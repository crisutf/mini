<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://cdn.crisu.qzz.io/files/png/crisutf/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisutf · Mini</title>
    <meta name="theme-color" content="#f4e4c4">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Landing Page Content -->
        <div id="landing-view">
            <h1>Crisutf</h1>
        </div>

        <!-- Redirecting State -->
        <div id="redirect-view" class="loader">
            <div class="spinner"></div>
            <p>Redirigiendo...</p>
        </div>

        <!-- Error State -->
        <div id="error-view" class="error-message" style="display: none;">
            <p id="error-text">Enlace no encontrado</p>
            <button onclick="location.href='/'" class="back-button">Volver</button>
        </div>
    </div>

    <script>
        const LINKS_URL = 'https://cdn.crisu.qzz.io/services/mini/links.json';

        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            let destinationKey = urlParams.get('d');

            if (!destinationKey) {
                const path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');
                if (path && path !== 'index.html') {
                    destinationKey = path;
                }
            }

            const landingView = document.getElementById('landing-view');
            const redirectView = document.getElementById('redirect-view');
            const errorView = document.getElementById('error-view');
            const errorText = document.getElementById('error-text');

            if (!destinationKey) {
                return;
            }

            landingView.style.display = 'none';
            redirectView.style.display = 'flex';

            try {
                const response = await fetch(LINKS_URL);
                if (!response.ok) throw new Error('Failed to load links');

                const links = await response.json();
                const key = destinationKey.trim().toLowerCase();
                const targetUrl = links[key] || links[destinationKey];

                if (targetUrl) {
                    window.location.replace(targetUrl);
                } else {
                    throw new Error('Link not found');
                }
            } catch (error) {
                console.error(error);
                redirectView.style.display = 'none';
                landingView.style.display = 'block';
                if (errorText && destinationKey) {
                    errorText.textContent = 'No encontré el enlace para "' + destinationKey + '"';
                }
                errorView.style.display = 'block';
            }
        }

        handleRedirect();
    </script>
</body>


</html>
